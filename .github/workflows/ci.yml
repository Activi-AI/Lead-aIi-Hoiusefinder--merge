name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Node dependencies
      run: |
        cd agents/lead-ai-mcp
        npm install

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install Python dependencies
      run: pip install -r requirements.txt

    - name: Run Node tests
      run: |
        cd agents/lead-ai-mcp
        npm test

    - name: Run Python tests
      run: python -m pytest src/housefinder/ || echo "No Python tests yet"